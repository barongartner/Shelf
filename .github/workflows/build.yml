name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "::error::tag ${{ github.ref_name }} but package.json says $v"; exit 1; }
      - name: Build installer and portable exe
        run: npx electron-builder --win --x64 --publish never
      # Tags attach straight to the release; the artifact is only for branch
      # builds, and the account's artifact storage filling up must not fail them.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        with:
          name: Shelf-windows
          path: |
            dist/Shelf-Setup-*.exe
            dist/Shelf-*-portable.exe
          retention-days: 5
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Shelf-Setup-*.exe
            dist/Shelf-*-portable.exe

  macos:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Runners have no signing certificate. The app is ad-hoc signed so it
      # opens after "Open Anyway" (or with no prompt when installed with
      # ditto, see the README). scripts/release-mac.sh on a Mac replaces
      # these with properly signed files.
      - name: Build (ad-hoc signed)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --x64 --arm64 --publish never -c.mac.identity=-
      - name: Check the signature
        run: |
          for app in dist/mac/Shelf.app dist/mac-arm64/Shelf.app; do
            codesign --verify --deep --strict "$app"
            codesign -dv "$app" 2>&1 | grep -E '^Identifier=com.barongartner.shelf' || { echo "::error::$app is not sealed as com.barongartner.shelf"; exit 1; }
          done
      # Tags attach straight to the release; the artifact is only for branch
      # builds, and the account's artifact storage filling up must not fail them.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        with:
          name: Shelf-macos
          path: |
            dist/Shelf-*-mac-*.zip
            dist/Shelf-*-mac-*.dmg
          retention-days: 5
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Shelf-*-mac-*.zip
            dist/Shelf-*-mac-*.dmg
